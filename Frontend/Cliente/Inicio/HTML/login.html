<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Marcos Cavalcante">
    <title>Login - Viva Finanças</title>
    <link rel="stylesheet" href="/Inicio/HTML/CSS/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header class="brand">
            <div class="logo-icon">
                <img src="/img/logo.png" alt="Logo">
            </div>
        
        </header>

        <main class="login-card">
            <h2>Login</h2>
            <p class="subtitle">Faça Login para continuar.</p>

            <form>
                <div class="input-group">
                    <label for="nome">NOME</label>
                    <input type="text" id="nome" placeholder="Jiara Martins">
                </div>

                <div class="input-group">
                    <label for="senha">SENHA</label>
                    <input type="password" id="senha" placeholder="******">
                </div>

                <button type="submit" class="btn-login">Log in</button>
            </form>

            <div class="links">
                <a href="/HTML/esqueciasenha.html">Esqueceu a senha?</a>
                <a href="/HTML/cadastro.html">Cadastre-se!</a>
            </div>
        </main>
    </div>

</body>
</html>
