<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viva Finanças - Recuperar Senha</title>
    <link rel="stylesheet" href="/Inicio/HTML/CSS/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-container">
        <div class="brand-column">
            <img src="/img/logo.png" alt="Logo Viva Finanças" class="brand-logo">
        </div>

        <div class="form-column">
            <div class="form-card">
                <h2 class="card-title">Esqueceu<br>sua senha?</h2>
                <p class="card-subtitle">Informe seu email e enviaremos um link para você criar uma nova senha.</p>

                <form id="form-recuperar">
                    <div class="input-group">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email" placeholder="email@exemplo.com" required>
                    </div>

                    <button type="submit" class="submit-button">Enviar instruções</button>
                </form>

                <p class="card-subtitle" id="mensagem-sucesso" style="display:none; margin-top: 20px; color: #0b8d43;">
                    Se esse email estiver cadastrado, você vai receber as instruções em poucos minutos. Confira também a caixa de spam.
                </p>
            </div>
        </div>
    </div>

    <script src="/Inicio/HTML/Javascript/api-client.js"></script>
    <script src="/Inicio/HTML/Javascript/auth.js"></script>
    <script src="/Inicio/HTML/Javascript/recuperar-senha.js"></script>
</body>
</html>
