<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — VivaFinanças Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Cliente/Admin/CSS/LoginAdmin.css">
</head>
<body>

<div class="login-wrapper">

    <div class="login-brand">
        <div>
            <div class="brand-logo">
                <svg viewBox="0 0 32 32" fill="none" width="32" height="32">
                    <rect width="6" height="14" x="2" y="18" rx="2" fill="white" opacity="0.6"/>
                    <rect width="6" height="20" x="13" y="12" rx="2" fill="white" opacity="0.8"/>
                    <rect width="6" height="28" x="24" y="4" rx="2" fill="white"/>
                </svg>
                VivaFinanças
            </div>
            <div class="brand-badge">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
                </svg>
                Painel Administrativo
            </div>
            <div class="brand-title">Gestão centralizada da plataforma</div>
            <div class="brand-desc">Monitore usuários, transações e métricas da plataforma em tempo real.</div>
        </div>
        <div class="brand-footer">© 2026 VivaFinanças — Acesso restrito</div>
    </div>

    <div class="login-form-area">
        <div class="form-title">Acesso admin</div>
        <div class="form-subtitle">Entre com suas credenciais de administrador</div>

        <div id="erro-msg" class="erro-msg hidden"></div>

        <div class="form-group">
            <label class="form-label">E-mail</label>
            <input type="email" id="email" class="form-control"
                placeholder="admin@vivafinancas.com" autocomplete="email">
        </div>

        <div class="form-group">
            <label class="form-label">Senha</label>
            <div class="input-wrapper">
                <input type="password" id="senha" class="form-control"
                    placeholder="••••••••" autocomplete="current-password">
                <button class="toggle-senha" id="btn-toggle-senha" type="button" title="Mostrar/ocultar senha">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </div>

        <button class="btn-login" id="btn-login">
            Entrar no painel
        </button>
    </div>

</div>

<script src="/Cliente/Admin/JS/Admin.js"></script>
<script>
    // Redireciona se já estiver logado
    if (sessionStorage.getItem('vf_token') && sessionStorage.getItem('vf_tipo') === 'Admin') {
        window.location.href = `${ADMIN_BASE}/DashboardAdmin.html`;
    }

    const inputEmail = document.getElementById('email');
    const inputSenha = document.getElementById('senha');
    const btnLogin   = document.getElementById('btn-login');

    inputEmail.addEventListener('keydown', e => {
        if (e.key === 'Enter') inputSenha.focus();
    });

    inputSenha.addEventListener('keydown', e => {
        if (e.key === 'Enter') fazerLogin();
    });

    document.getElementById('btn-toggle-senha').addEventListener('click', () => {
        inputSenha.type = inputSenha.type === 'password' ? 'text' : 'password';
    });

    btnLogin.addEventListener('click', fazerLogin);

    async function fazerLogin() {
        const email = inputEmail.value.trim();
        const senha = inputSenha.value;
        const erroEl = document.getElementById('erro-msg');

        if (!email || !senha) {
            mostrarErroLogin('Preencha e-mail e senha.');
            return;
        }

        btnLogin.disabled = true;
        btnLogin.innerHTML = '<div class="spinner"></div> Verificando...';
        erroEl.classList.add('hidden');

        // CORREÇÃO: usa loginAdmin() do admin.js, que já trata 429/403/erro
        // de rede de forma padronizada e nunca deixa o botão travado —
        // sempre cai no finally abaixo independente do resultado.
        const resultado = await loginAdmin(email, senha);

        if (!resultado.ok) {
            mostrarErroLogin(resultado.mensagem);
            btnLogin.disabled = false;
            btnLogin.innerHTML = 'Entrar no painel';
            return;
        }

        salvarToken(resultado.data.token, resultado.data.nome, resultado.data.tipo);
        window.location.href = `${ADMIN_BASE}/DashboardAdmin.html`;
    }

    function mostrarErroLogin(msg) {
        const el = document.getElementById('erro-msg');
        el.textContent = msg;
        el.classList.remove('hidden');
    }
</script>

</body>
</html>
