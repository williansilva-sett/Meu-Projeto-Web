<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transações — VivaFinanças Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Frontend/Admin/CSS/Admin.css">
</head>
<body>

<div class="admin-layout">

    <!-- HEADER -->
    <header class="admin-header">
        <div class="header-logo">
            <svg viewBox="0 0 32 32" fill="none" width="28" height="28">
                <rect width="6" height="14" x="2" y="18" rx="2" fill="white" opacity="0.6"/>
                <rect width="6" height="20" x="13" y="12" rx="2" fill="white" opacity="0.8"/>
                <rect width="6" height="28" x="24" y="4" rx="2" fill="white"/>
            </svg>
            VivaFinanças
            <span class="admin-badge">Admin</span>
        </div>
        <div class="header-user">
            <div class="header-avatar" id="admin-avatar">A</div>
            <span id="admin-nome">Admin</span>
        </div>
    </header>

    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
        <nav class="sidebar-nav">
            <span class="sidebar-section-label">Menu</span>
            <a href="/Frontend/Admin/HTML/DashboardAdmin.html" class="sidebar-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
                </svg>
                Dashboard
            </a>
            <a href="/Frontend/Admin/HTML/Usuarios.html" class="sidebar-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                Usuários
            </a>
            <a href="/Frontend/Admin/HTML/Movimentacoes.html" class="sidebar-link ativo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="1" x2="12" y2="23"/>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
                Transações
            </a>
        </nav>
        <div class="sidebar-footer">
            <button class="btn-sair" id="btn-sair">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Sair
            </button>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="admin-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Transações</h1>
                <p class="page-subtitle">Entradas e saídas de toda a plataforma</p>
            </div>
        </div>

        <!-- FILTROS -->
        <div class="card" style="margin-bottom:16px;">
            <div class="card-body" style="padding:16px 24px;">
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto auto;gap:12px;align-items:end;">

                    <div class="form-group" style="margin:0;">
                        <label class="form-label">Tipo</label>
                        <select id="filtro-tipo" class="form-control">
                            <option value="todos">Todos</option>
                            <option value="entrada">Entrada</option>
                            <option value="saida">Saída</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin:0;">
                        <label class="form-label">Data início</label>
                        <input type="date" id="filtro-inicio" class="form-control">
                    </div>

                    <div class="form-group" style="margin:0;">
                        <label class="form-label">Data fim</label>
                        <input type="date" id="filtro-fim" class="form-control">
                    </div>

                    <button class="btn btn-primary" onclick="aplicarFiltros()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                            <line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/>
                            <line x1="12" y1="18" x2="12" y2="18"/>
                        </svg>
                        Filtrar
                    </button>

                    <button class="btn btn-outline" onclick="limparFiltros()">Limpar</button>
                </div>
            </div>
        </div>

        <!-- TABELA -->
        <div class="card">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Tipo</th>
                            <th>Descrição</th>
                            <th>Categoria</th>
                            <th>Usuário</th>
                            <th>Data</th>
                            <th style="text-align:right;">Valor</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-body">
                        <tr>
                            <td colspan="6">
                                <div class="loading"><div class="spinner"></div> Carregando...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="paginacao">
                <span class="paginacao-info" id="paginacao-info"></span>
                <div class="paginacao-btns" id="paginacao-btns"></div>
            </div>
        </div>
    </main>
</div>

<div id="toast-container"></div>

<script src="/Frontend/Admin/JS/Admin.js"></script>
<script>
    if (!requerAdmin()) { /* redireciona */ }
    inicializarLayout();

    let pagina   = 1;
    const pageSize = 20;
    let totalItens = 0;

    // Carrega ao iniciar
    carregarTransacoes();

    function aplicarFiltros() {
        pagina = 1;
        carregarTransacoes();
    }

    function limparFiltros() {
        document.getElementById('filtro-tipo').value    = 'todos';
        document.getElementById('filtro-inicio').value  = '';
        document.getElementById('filtro-fim').value     = '';
        pagina = 1;
        carregarTransacoes();
    }

    async function carregarTransacoes() {
        const tipo   = document.getElementById('filtro-tipo').value;
        const inicio = document.getElementById('filtro-inicio').value;
        const fim    = document.getElementById('filtro-fim').value;

        const params = new URLSearchParams({ tipo, page: pagina, pageSize });
        if (inicio) params.append('dataInicio', inicio);
        if (fim)    params.append('dataFim', fim);

        document.getElementById('tabela-body').innerHTML =
            `<tr><td colspan="6"><div class="loading"><div class="spinner"></div> Carregando...</div></td></tr>`;

            const resultado = await apiGet(`/api/admin/transacoes?${params}`);

        if (!resultado.ok || !resultado.data) {
            document.getElementById('tabela-body').innerHTML =
                `<tr><td colspan="6" style="text-align:center;color:var(--vermelho);padding:24px;">Erro ao carregar transações.</td></tr>`;
            return;
        }

        const data = resultado.data;
        totalItens = data.totalItens;
        renderTabela(data.itens);
        renderPaginacao(data.totalPaginas);
    }

    function renderTabela(transacoes) {
        const tbody = document.getElementById('tabela-body');

        if (!transacoes.length) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--cinza-400);padding:32px;">Nenhuma transação encontrada.</td></tr>`;
            return;
        }

        tbody.innerHTML = transacoes.map(t => {
            const isEntrada = t.tipo === 'Entrada';
            return `
                <tr>
                    <td>
                        <span class="badge ${isEntrada ? 'badge-verde' : 'badge-vermelho'}">
                            ${isEntrada ? '↑ Entrada' : '↓ Saída'}
                        </span>
                    </td>
                    <td style="font-size:13px;">
                        ${t.descricao || '<span class="text-muted">—</span>'}
                    </td>
                    <td>
                        <span style="font-size:12px;background:var(--cinza-100);padding:3px 8px;border-radius:4px;color:var(--cinza-600);">
                            ${t.nomeCategoria || '—'}
                        </span>
                    </td>
                    <td style="font-size:13px;color:var(--cinza-600);">
                        ${t.nomeUsuario || '—'}
                    </td>
                    <td style="font-size:13px;color:var(--cinza-600);">
                        ${formatarData(t.data)}
                    </td>
                    <td style="text-align:right;font-weight:700;font-size:14px;color:${isEntrada ? 'var(--verde-medio)' : 'var(--vermelho)'};">
                        ${isEntrada ? '+' : '-'} ${formatarMoeda(t.valor)}
                    </td>
                </tr>
            `;
        }).join('');
    }

    function renderPaginacao(totalPaginas) {
        const info  = document.getElementById('paginacao-info');
        const btns  = document.getElementById('paginacao-btns');
        const inicio = (pagina - 1) * pageSize + 1;
        const fim    = Math.min(pagina * pageSize, totalItens);

        info.textContent = totalItens > 0
            ? `Mostrando ${inicio}–${fim} de ${totalItens}`
            : 'Nenhum resultado';

        if (totalPaginas <= 1) { btns.innerHTML = ''; return; }

        let html = `<button class="paginacao-btn" onclick="irPagina(${pagina - 1})" ${pagina === 1 ? 'disabled' : ''}>‹</button>`;

        for (let i = 1; i <= totalPaginas; i++) {
            if (i === 1 || i === totalPaginas || (i >= pagina - 1 && i <= pagina + 1)) {
                html += `<button class="paginacao-btn ${i === pagina ? 'ativo' : ''}" onclick="irPagina(${i})">${i}</button>`;
            } else if (i === pagina - 2 || i === pagina + 2) {
                html += `<span style="padding:5px 4px;color:var(--cinza-400);">…</span>`;
            }
        }

        html += `<button class="paginacao-btn" onclick="irPagina(${pagina + 1})" ${pagina === totalPaginas ? 'disabled' : ''}>›</button>`;
        btns.innerHTML = html;
    }

    async function irPagina(n) {
        pagina = n;
        await carregarTransacoes();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>

</body>
</html>
