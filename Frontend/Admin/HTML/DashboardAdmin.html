<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — VivaFinanças Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Frontend/Admin/CSS/Admin.css">
</head>
<body>

<div class="admin-layout">

    <!-- HEADER -->
    <header class="admin-header">
        <div class="header-logo">
            <svg viewBox="0 0 32 32" fill="none" width="28" height="28">
                <rect width="6" height="14" x="2" y="18" rx="2" fill="white" opacity="0.6"/>
                <rect width="6" height="20" x="13" y="12" rx="2" fill="white" opacity="0.8"/>
                <rect width="6" height="28" x="24" y="4" rx="2" fill="white"/>
            </svg>
            VivaFinanças
            <span class="admin-badge">Admin</span>
        </div>
        <div class="header-user">
            <div class="header-avatar" id="admin-avatar">A</div>
            <span id="admin-nome">Admin</span>
        </div>
    </header>

    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
        <nav class="sidebar-nav">
            <span class="sidebar-section-label">Menu</span>
            <a href="/Frontend/Admin/HTML/DashboardAdmin.html" class="sidebar-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
                </svg>
                Dashboard
            </a>
            <a href="/Frontend/Admin/HTML/Usuarios.html" class="sidebar-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                Usuários
            </a>
            <a href="/Frontend/Admin/HTML/Movimentacoes.html" class="sidebar-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="1" x2="12" y2="23"/>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
                Transações
            </a>
        </nav>
        <div class="sidebar-footer">
            <button class="btn-sair" id="btn-sair">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Sair
            </button>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="admin-main">
        <div class="page-header">
            <div>
                <h1 class="page-title">Dashboard</h1>
                <p class="page-subtitle">Visão geral da plataforma</p>
            </div>
            <button class="btn btn-outline" id="btn-atualizar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                    <polyline points="23 4 23 10 17 10"/>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                </svg>
                Atualizar
            </button>
        </div>

        <!-- MÉTRICAS -->
        <div class="metrics-grid" id="metrics-grid">
            <div class="loading"><div class="spinner"></div> Carregando...</div>
        </div>

        <!-- LINHA INFERIOR -->
        <div class="dashboard-grid">

            <!-- Resumo financeiro -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Resumo financeiro</span>
                </div>
                <div class="card-body" id="resumo-financeiro">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>

            <!-- Acesso rápido -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Acesso rápido</span>
                </div>
                <div class="card-body">
                    <div class="acesso-rapido-lista">
                        <a href="/Frontend/Admin/HTML/Usuarios.html" class="acesso-rapido-item">
                            <div class="acesso-rapido-icon verde">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                    <circle cx="9" cy="7" r="4"/>
                                </svg>
                            </div>
                            <div>
                                <div class="acesso-rapido-titulo">Gerenciar usuários</div>
                                <div class="text-muted">Ver, editar e excluir contas</div>
                            </div>
                        </a>
                        <a href="/Frontend/Admin/HTML/Movimentacoes.html" class="acesso-rapido-item">
                            <div class="acesso-rapido-icon azul">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                    <line x1="12" y1="1" x2="12" y2="23"/>
                                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                                </svg>
                            </div>
                            <div>
                                <div class="acesso-rapido-titulo">Ver transações</div>
                                <div class="text-muted">Entradas e saídas da plataforma</div>
                            </div>
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>

<div id="toast-container"></div>

<script src="/Frontend/Admin/JS/Admin.js"></script>
<script>
    if (!requerAdmin()) { /* redireciona */ }
    inicializarLayout();

    document.getElementById('btn-atualizar').addEventListener('click', carregarDashboard);

    carregarDashboard();

    async function carregarDashboard() {
        mostrarLoading('metrics-grid');
        mostrarLoading('resumo-financeiro');

        // CORREÇÃO: apiGet agora devolve {ok, data, status} — sempre.
        // Antes, se a chamada falhasse, "data" virava null e só o bloco
        // de métricas tratava isso; o card de resumo financeiro nunca
        // recebia esse sinal e ficava com o spinner girando para sempre.
        const resposta = await apiGet('/api/admin/dashboard');

        if (!resposta.ok) {
            const msg = resposta.status === 0
                ? 'Não foi possível conectar ao servidor.'
                : 'Erro ao carregar dados do dashboard.';

            mostrarErro('metrics-grid', msg);
            mostrarErro('resumo-financeiro', msg); // <- antes faltava isso
            return;
        }

        const data = resposta.data;

        document.getElementById('metrics-grid').innerHTML = `
            <div class="metric-card">
                <div class="metric-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                    </svg>
                </div>
                <div class="metric-label">Total de usuários</div>
                <div class="metric-valor">${Number(data.totalUsuarios) || 0}</div>
            </div>
            <div class="metric-card azul">
                <div class="metric-icon azul">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <rect x="2" y="3" width="20" height="14" rx="2"/>
                        <line x1="8" y1="21" x2="16" y2="21"/>
                        <line x1="12" y1="17" x2="12" y2="21"/>
                    </svg>
                </div>
                <div class="metric-label">Contas ativas</div>
                <div class="metric-valor azul">${Number(data.totalContas) || 0}</div>
            </div>
            <div class="metric-card verde">
                <div class="metric-icon verde">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
                        <polyline points="17 6 23 6 23 12"/>
                    </svg>
                </div>
                <div class="metric-label">Total entradas</div>
                <div class="metric-valor verde">${Number(data.totalEntradas) || 0}</div>
            </div>
            <div class="metric-card vermelho">
                <div class="metric-icon vermelho">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/>
                        <polyline points="17 18 23 18 23 12"/>
                    </svg>
                </div>
                <div class="metric-label">Total saídas</div>
                <div class="metric-valor vermelho">${Number(data.totalSaidas) || 0}</div>
            </div>
        `;

        document.getElementById('resumo-financeiro').innerHTML = `
            <div class="resumo-linha">
                <span class="resumo-linha-label">Total em entradas</span>
                <span class="resumo-linha-valor verde">${formatarMoeda(data.valorEntradas)}</span>
            </div>
            <div class="resumo-linha">
                <span class="resumo-linha-label">Total em saídas</span>
                <span class="resumo-linha-valor vermelho">${formatarMoeda(data.valorSaidas)}</span>
            </div>
            <div class="resumo-total">
                <span class="resumo-total-label">Saldo geral</span>
                <span class="resumo-total-valor ${data.saldoGeral >= 0 ? 'verde' : 'vermelho'}">
                    ${formatarMoeda(data.saldoGeral)}
                </span>
            </div>
        `;
    }
</script>

</body>
</html>
