<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Marcos Cavalcante">
    <title>Viva Finanças - Cadastro</title>
    <link rel="stylesheet" href="/Cliente/CSS/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-container">
        <div class="brand-column">
            <img src="/Cliente/img/logo.png" alt="Logo Viva Finanças" class="brand-logo">
            
        </div>

        <div class="form-column">
            <div class="form-card">
                <h2 class="card-title">Criar sua Conta</h2>
                <p class="card-subtitle">Já tem uma conta? <a href="/Cliente/HTML/login.html">Faça Login</a></p>

                <form>
                    <div class="input-group">
                        <label for="nome">NOME</label>
                        <input type="text" id="nome" name="nome" placeholder="Jiara Martins">
                    </div>

                    <div class="input-group">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email" placeholder="email@exemplo.com">
                    </div>

                    <div class="input-group">
                        <label for="telefone">TELEFONE</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(+55) xx xxxxx-xxxx">
                    </div>

                    <div class="input-group">
                        <label for="senha">SENHA</label>
                        <input type="password" id="senha" name="senha" placeholder="******">
                    </div>

                    <div class="input-group">
                        <label for="data-nascimento">DATA DE NASCIMENTO</label>
                        <input type="text" id="data-nascimento" name="data-nascimento" placeholder="Selecionar Datas">
                    </div>

                    <button type="submit" class="submit-button">Cadastrar-se</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
