<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Viva Finanças - Recuperar Senha</title>
        <link rel="stylesheet" href="/Cliente/CSS/style.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    </head>

    <body>
        <div class="main-container">
            <div class="brand-column">
                <img src="/Cliente/img/logo.png" alt="Logo Viva Finanças" class="brand-logo">
            
            </div>

            <div class="form-column">
                <div class="form-card">
                    <h2 class="card-title">Esqueceu<br>sua senha?</h2>
                    <p class="card-subtitle">Escolha uma das opções abaixo para redefinir sua senha</p>

                    <div class="recovery-section">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email" placeholder="email@exemplo.com">
                        <p class="masked-info">jirara******@gmail.com</p>
                        <div class="recovery-button">
                            <div class="icon-circle">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                            </div>
                            <span>Redefinir senha via email</span>
                        </div>
                    </div>

                    <div class="recovery-section">
                        <label for="telefone">TELEFONE</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(+55) xx xxxxx-xxxx">
                        <p class="masked-info">(+55) XXXXX-XXXX</p>
                        <div class="recovery-button">
                            <div class="icon-circle">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                            </div>
                            <span>Redefinir a senha via SMS/Whatsapp</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
